<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start!</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --search-bg: #f1f3f4;
            --hover-color: rgba(60, 64, 67, 0.1);
            --accent: #1a73e8;
            --circle-bg: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --search-bg: #303134;
                --hover-color: rgba(255, 255, 255, 0.1);
                --accent: #8ab4f8;
                --circle-bg: rgba(255, 255, 255, 0.08);
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 15vh;
            transition: background-color 0.3s ease;
        }

        .search-form {
            width: 100%;
            max-width: 584px;
            margin-bottom: 50px;
        }

        .search-input {
            width: 100%;
            height: 48px;
            background: var(--search-bg);
            border: 1px solid transparent;
            border-radius: 24px;
            padding: 0 24px;
            font-size: 16px;
            color: var(--text-color);
            outline: none;
            box-shadow: 0 1px 6px rgba(0,0,0,0.1);
        }

        .container {
            width: 100%;
            max-width: 1344px; 
            margin: 0 auto;
        }

        .category-section {
            width: 100%;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, 112px);
            justify-content: center;
            width: 100%;
        }

        .shortcut {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0; 
            border-radius: 12px;
            transition: background 0.2s;
            width: 112px;
        }

        .shortcut:hover {
            background-color: var(--hover-color);
        }

        .icon-container {
            width: 48px;
            height: 48px;
            background-color: var(--circle-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            transition: transform 0.2s ease;
        }

        .shortcut:hover .icon-container {
            transform: scale(1.05);
        }

        .icon-container img {
            /* Gebruik max in plaats van een vaste breedte */
            max-width: 32px; 
            max-height: 32px;
            width: auto;
            height: auto;
            object-fit: contain; /* Zorgt dat het icoon altijd binnen de container blijft */
        }

        .label {
            font-size: 12px;
            width: 96px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <form class="search-form" action="https://www.google.com/search" method="GET">
        <input type="text" name="q" class="search-input" placeholder="Zoek op Google..." autocomplete="off">
    </form>

    <div id="main-container" class="container"></div>

    <script>
        async function loadLinks() {
            try {
                const response = await fetch('links.json');
                const data = await response.json();
                const container = document.getElementById('main-container');

                for (const [category, links] of Object.entries(data)) {
                    const section = document.createElement('div');
                    section.className = 'category-section';
                    
                    const grid = document.createElement('div');
                    grid.className = 'grid';

                    links.forEach(link => {
                        const urlObj = new URL(link.url);
                        const domain = urlObj.hostname;
                        
                        // Hier gebeurt de 'optionele' check:
                        const iconSrc = link.icon ? link.icon : `https://icons.duckduckgo.com/ip3/${domain}.ico`;
                        
                        const el = document.createElement('a');
                        el.className = 'shortcut';
                        el.href = link.url;
                        el.innerHTML = `
                            <div class="icon-container">
                                <img src="${iconSrc}" alt="">
                            </div>
                            <div class="label">${link.name}</div>
                        `;
                        grid.appendChild(el);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                }
            } catch (e) { 
                console.error("Fout:", e); 
            }
        }
        loadLinks();
    </script>
</body>
</html>
